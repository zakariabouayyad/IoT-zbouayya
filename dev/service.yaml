# LoadBalancer: K3s exposes port 8888 on the node, and K3d maps it to
# localhost:8888 on the host. Unlike `kubectl port-forward`, this keeps
# working when Argo CD replaces the pod (v1 -> v2).
apiVersion: v1
kind: Service
metadata:
  name: wil-playground
  namespace: dev
  labels:
    app: wil-playground
spec:
  type: LoadBalancer
  selector:
    app: wil-playground
  ports:
    - port: 8888
      targetPort: 8888
      protocol: TCP
